<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="run waits on a new line. A paste appears with its line breaks and a comment, then the commands run and the comment is not a command.">
<defs>
<style>
text{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
.dim{fill:#6e6a82}
.ink{fill:#e8e6f2}
.hot{fill:#ff2a6d}
.ice{fill:#29f0ff}
.leaf{fill:#3dff9a}
.amber{fill:#f6c445}
.beat{animation:8s step-end infinite}
.caret{animation:blink 1.05s steps(1) infinite}
@keyframes a0{0%{visibility:visible}20%{visibility:hidden}100%{visibility:hidden}}
@keyframes a1{0%{visibility:hidden}20%{visibility:visible}40%{visibility:hidden}100%{visibility:hidden}}
@keyframes a2{0%{visibility:hidden}40%{visibility:visible}60%{visibility:hidden}100%{visibility:hidden}}
@keyframes a3{0%{visibility:hidden}60%{visibility:visible}100%{visibility:visible}}
@keyframes blink{0%,46%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .beat{animation:none;visibility:hidden}
  .a3{visibility:visible}
  .caret{animation:none;opacity:1}
}
</style>
</defs>
<rect width="920" height="420" fill="#07060f"/>
<rect x="20" y="16" width="880" height="388" rx="18" fill="#0c0a16" stroke="#ff2a6d" stroke-opacity=".45"/>
<rect x="20" y="16" width="880" height="52" rx="18" fill="#120e1c"/>
<rect x="20" y="50" width="880" height="18" fill="#120e1c"/>
<circle cx="48" cy="42" r="6" fill="#ff2a6d"/>
<circle cx="70" cy="42" r="6" fill="#f6c445"/>
<circle cx="92" cy="42" r="6" fill="#3dff9a"/>
<text x="116" y="48" fill="#e8e6f2" font-size="15">run</text>
<text x="460" y="48" fill="#6e6a82" font-size="14" text-anchor="middle">~/app</text>
<text x="868" y="48" fill="#29f0ff" font-size="13" text-anchor="end">paste</text>
<g class="beat" style="animation-name:a0">
  <text x="56" y="120" font-size="18"><tspan class="hot">❯ </tspan><tspan class="ink">run</tspan><tspan class="caret hot">▍</tspan></text>
</g>
<g class="beat" style="animation-name:a1">
  <text x="56" y="120" font-size="18"><tspan class="hot">❯ </tspan><tspan class="ink">run</tspan></text>
  <text x="56" y="168" class="ink" font-size="18">cd ~/app</text>
</g>
<g class="beat" style="animation-name:a2">
  <text x="56" y="120" font-size="18"><tspan class="hot">❯ </tspan><tspan class="ink">run</tspan></text>
  <text x="56" y="168" class="ink" font-size="18">cd ~/app</text>
  <text x="56" y="216" font-size="18"><tspan class="ink">git status -sb</tspan><tspan class="dim">   # expect clean</tspan></text>
</g>
<g class="beat a3" style="animation-name:a3">
  <text x="56" y="120" font-size="18"><tspan class="hot">❯ </tspan><tspan class="ink">run</tspan></text>
  <text x="56" y="168" class="ink" font-size="18">cd ~/app</text>
  <text x="56" y="216" font-size="18"><tspan class="ink">git status -sb</tspan><tspan class="dim">   # expect clean</tspan></text>
  <text x="56" y="280" class="leaf" font-size="18">## main</text>
</g>
<text x="56" y="364" class="dim" font-size="14">// the comment is not a command. cd sticks.</text>
</svg>
